<header class="sticky top-0 z-50 bg-brown-deep border-b border-brass/25 shadow-sm">
  <!-- Wider container + tighter left padding so the logo sits closer to the edge. -->
  <div class="mx-auto max-w-7xl px-3 md:px-5 flex items-center justify-between h-24">
    <a routerLink="/" class="flex items-center gap-3 group" (click)="closeMobile()">
      <!-- Crop the bottom text out of the JPG via background-position so only the round
           logo shows. background-size > 100% scales up the round portion to fill cleanly,
           avoiding the blurry look of object-fit clipping. -->
      <span
        class="block w-16 h-16 md:w-[72px] md:h-[72px] rounded-full bg-cream ring-2 ring-brass-bright/50 shadow-soft shrink-0 bg-no-repeat"
        style="background-image: url('assets/logo/logo.jpg'); background-size: 145%; background-position: center 30%;"
        role="img"
        aria-label="Logo Chùa Quan Âm"
      ></span>
      <span class="font-display text-xl md:text-2xl text-brass-bright tracking-wide group-hover:text-brass-soft transition-colors">
        Chùa Quan Âm
      </span>
    </a>

    <nav class="hidden md:flex items-center gap-9" aria-label="Menu chính">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          routerLinkActive="text-brass-soft after:scale-x-100"
          class="relative text-sm text-brass-bright/90 hover:text-brass-soft tracking-wide transition-colors
                 after:content-[''] after:absolute after:left-0 after:right-0 after:-bottom-1.5 after:h-px
                 after:bg-brass-soft after:scale-x-0 after:transition-transform after:origin-left"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <button
      type="button"
      class="md:hidden grid place-items-center w-10 h-10 rounded-full border border-brass-bright/40 text-brass-bright hover:bg-brown-mid transition-colors"
      (click)="toggleMobile()"
      [attr.aria-expanded]="mobileOpen()"
      aria-label="Mở menu"
    >
      @if (mobileOpen()) {
        <i class="pi pi-times text-base"></i>
      } @else {
        <i class="pi pi-bars text-base"></i>
      }
    </button>
  </div>

  @if (mobileOpen()) {
    <nav class="md:hidden border-t border-brass-bright/20 bg-brown-deep" aria-label="Menu mobile">
      <ul class="container-narrow py-4 flex flex-col">
        @for (item of navItems; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              [routerLinkActiveOptions]="{ exact: item.path === '/' }"
              routerLinkActive="text-brass-soft"
              (click)="closeMobile()"
              class="block py-3 text-base text-brass-bright/90 hover:text-brass-soft border-b border-brass-bright/15 last:border-none"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  }
</header>
