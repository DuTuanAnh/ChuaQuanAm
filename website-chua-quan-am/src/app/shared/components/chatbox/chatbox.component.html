<div class="fixed bottom-6 right-6 z-40">
  @if (open()) {
    <div class="w-[340px] max-w-[92vw] bg-cream border border-line rounded-2xl shadow-deep flex flex-col overflow-hidden">
      <div class="px-4 py-3 bg-brown-deep text-cream flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i class="pi pi-comments"></i>
          <span class="font-display">Hỏi đáp</span>
        </div>
        <button (click)="toggle()" aria-label="Đóng" class="hover:text-brass-soft">
          <i class="pi pi-times"></i>
        </button>
      </div>
      <ul class="flex-1 max-h-80 overflow-y-auto px-4 py-3 space-y-3">
        @for (m of messages(); track m.ts) {
          <li
            class="text-sm leading-relaxed"
            [class.text-brown-deep]="m.role === 'assistant'"
            [class.text-ink]="m.role === 'user'"
          >
            <span
              class="inline-block px-3 py-2 rounded-2xl"
              [class.bg-cream-warm]="m.role === 'assistant'"
              [class.bg-brown-deep]="m.role === 'user'"
              [class.text-cream]="m.role === 'user'"
            >
              {{ m.text }}
            </span>
          </li>
        }
      </ul>
      <form
        class="border-t border-line p-3 flex gap-2"
        (submit)="$event.preventDefault(); send(input)"
      >
        <input
          #input
          type="text"
          placeholder="Nhập câu hỏi…"
          class="flex-1 rounded-full border border-line px-4 py-2 text-sm focus:outline-none focus:border-brass"
        />
        <button
          type="submit"
          class="grid place-items-center w-10 h-10 rounded-full bg-brown-deep text-cream hover:bg-brown-mid"
          aria-label="Gửi"
        >
          <i class="pi pi-send"></i>
        </button>
      </form>
    </div>
  } @else {
    <button
      type="button"
      class="grid place-items-center w-14 h-14 rounded-full bg-brown-deep text-cream shadow-deep hover:bg-brown-mid transition-colors"
      aria-label="Mở hỏi đáp"
      (click)="toggle()"
    >
      <i class="pi pi-comments text-lg"></i>
    </button>
  }
</div>
